<!DOCTYPE html>
<html lang="bn">
<head>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for Bengali Typography & Cartoon Comic Feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Hind+Siliguri:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Hind Siliguri', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      background: radial-gradient(circle at 50% 25%, #fff3b0 0%, #ffcca8 50%, #ff7675 100%);
    }

    .comic-font {
      font-family: 'Fredoka One', cursive, 'Hind Siliguri', sans-serif;
    }

    .halftone-bg {
      background-image: radial-gradient(#d63031 1.2px, transparent 1.2px), radial-gradient(#d63031 1.2px, #fff5e6 1.2px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      opacity: 0.15;
    }

    /* Speech Bubble styling */
    .speech-bubble {
      position: relative;
      background: #ffffff;
      border: 4px solid #1e272e;
      box-shadow: 6px 6px 0px #1e272e;
      border-radius: 28px;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 18px 14px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 22px 18px 0;
      border-style: solid;
      border-color: #1e272e transparent;
      display: block;
      width: 0;
    }

    /* Comic Buttons */
    .comic-btn {
      transition: all 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 4px solid #1e272e;
      box-shadow: 0px 8px 0px #1e272e;
    }

    .comic-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0px 11px 0px #1e272e;
    }

    .comic-btn:active {
      transform: translateY(4px);
      box-shadow: 0px 4px 0px #1e272e;
    }

    /* Animations */
    @keyframes angry-shake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-3px, 2px) rotate(-1.5deg); }
      40% { transform: translate(3px, -2px) rotate(1.5deg); }
      60% { transform: translate(-3px, -1px) rotate(-1deg); }
      80% { transform: translate(3px, 1px) rotate(1deg); }
    }

    .shake-angry {
      animation: angry-shake 0.3s infinite;
    }

    @keyframes pop-bounce {
      0% { transform: scale(0) rotate(-10deg); opacity: 0; }
      70% { transform: scale(1.15) rotate(4deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .pop-in {
      animation: pop-bounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Canvas for particles */
    #fx-canvas {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 40;
    }
  </style>
</head>

  <!-- Sound Engine, Particles & Game State Logic -->
  <script>
    let audioCtx = null;
    let isSoundMuted = false;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Comical Sound Synthesizers via Web Audio API
    const SoundFX = {
      pop() {
        if (isSoundMuted) return;
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      },

      poof() {
        if (isSoundMuted) return;
        initAudio();
        // White noise smoke blast
        const bufferSize = audioCtx.sampleRate * 0.3;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.08));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(900, audioCtx.currentTime);
        filter.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.3);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();

        // Slide down pitch
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.35);
        oscGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      },

      bark(pitch = 280) {
        if (isSoundMuted) return;
        initAudio();
        const now = audioCtx.currentTime;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(pitch * 0.55, now + 0.16);

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(950, now);
        filter.Q.setValueAtTime(2.2, now);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.65, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.2);
      },

      magicGlissando() {
        if (isSoundMuted) return;
        initAudio();
        const now = audioCtx.currentTime;
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.06);
          gain.gain.setValueAtTime(0.25, now + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.25);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.26);
        });
      }
    };

    // Canvas Particles
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, type = 'smoke') {
        this.x = x;
        this.y = y;
        this.type = type;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 1;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.015;
        this.size = type === 'smoke' ? Math.random() * 22 + 16 : Math.random() * 10 + 6;
        this.color = type === 'smoke' 
          ? ['#ffffff', '#f1f2f6', '#dfe4ea', '#ffa502'][Math.floor(Math.random() * 4)]
          : ['#ffd32a', '#2ed573', '#ff4757', '#1e90ff'][Math.floor(Math.random() * 4)];
        this.text = type === 'emoji' ? ['🦴', '🐶', '💥', '🐾', '✨'][Math.floor(Math.random() * 5)] : null;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.05;
        this.life -= this.decay;
        if (this.type === 'smoke') this.size += 0.4;
      }

      draw(c) {
        c.save();
        c.globalAlpha = Math.max(0, this.life);
        if (this.text) {
          c.font = `${Math.floor(this.size * 1.5)}px Arial`;
          c.fillText(this.text, this.x, this.y);
        } else {
          c.fillStyle = this.color;
          c.beginPath();
          c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          c.fill();
        }
        c.restore();
      }
    }

    function spawnSmokeAndBursts(x, y, count = 28, isSparkle = false) {
      for (let i = 0; i < count; i++) {
        const type = isSparkle ? (Math.random() > 0.4 ? 'sparkle' : 'emoji') : (Math.random() > 0.3 ? 'smoke' : 'sparkle');
        particles.push(new Particle(x, y, type));
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.life <= 0) {
          particles.splice(i, 1);
